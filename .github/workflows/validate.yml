name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Reserved list present
        run: test -s reserved/terms.sha256
      - run: npm run validate
      - name: Forbidden files (PDFs, import caches, plain reserved list)
        run: |
          if git ls-files | grep -Ei '(^|/)\.cache/|\.pdf$|reserved/terms\.local\.txt$'; then
            echo "PDFs, import caches and the plain reserved list must not be committed"
            exit 1
          fi
