name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build archive
        run: |
          mkdir -p dist
          zip -r "dist/orc-rules-data-${GITHUB_REF_NAME}.zip" data schema i18n books.json LICENSE-DATA LICENSE-CODE README.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
